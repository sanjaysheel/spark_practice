services:
  spark-practice-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-practice
    container_name: spark-practice-dev
    working_dir: /app/project
    command: sleep infinity
    environment:
      PYSPARK_PYTHON: python
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_DRIVER_HOST: localhost
      SPARK_MASTER_URL: local[*]
    ports:
      - "4040:4040"
      - "4041:4041"
    volumes:
      - ./project:/app/project
      - ./:/workspace/Spark_practice
